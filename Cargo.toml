[package]
name = "newkitine"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
maxminddb = "0.29.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
soulseek = { git = "https://github.com/PixelMelt/libsoulseek" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "mysql"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
toml = "1.1.2"
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["io-util"] }
