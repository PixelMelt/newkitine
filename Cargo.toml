[package]
name = "newkitine"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false }
maxminddb = "0.29.0"
percent-encoding = "2.3"
quick-xml = { version = "0.42", features = ["async-tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
soulseek = { git = "https://github.com/PixelMelt/libsoulseek" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "mysql"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "1.1.2"
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
